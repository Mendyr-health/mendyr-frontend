openapi: 3.0.3
info:
  title: Mendyr Platform API
  description: >
    OpenAPI specification for the Mendyr healthcare platform backend (FastAPI).
    Reverse-engineered from the mendyr-frontend codebase's confirmed network calls,
    shared TypeScript types (src/types/index.ts), and inferred/stubbed UI affordances.
    Endpoints and fields marked INFERRED in their description are not backed by a
    confirmed frontend fetch call and should be confirmed with product/frontend
    before being treated as a hard contract.
  version: "1.0.0"
servers:
  - url: "{baseUrl}"
    description: Configured via NEXT_PUBLIC_API_URL on the frontend (Auth under /api/auth, all else under /api/v1)
    variables:
      baseUrl:
        default: https://api.mendyr.com

tags:
  - name: Auth
    description: Authentication and session endpoints (unauthenticated + auth-boundary actions). Base path /api/auth (no v1).
  - name: Public
    description: Unauthenticated public marketing/intake endpoints under /api/v1.
  - name: Admin
    description: Admin portal endpoints (role ADMIN).
  - name: SuperAdmin
    description: Super Admin platform governance endpoints (role SUPER_ADMIN).
  - name: Nurse
    description: Nurse portal endpoints (role NURSE) - appointments, availability, earnings, documents, messaging, profile/status.
  - name: Patient
    description: Patient portal endpoints (role PATIENT).

security:
  - cookieAuth: []

paths:
  # ─────────────────────────────── AUTH ───────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with email/password
      description: Authenticates a user and sets an httpOnly session cookie. NOTE - this response wraps the user as `{ user: UserPublic }`, unlike GET /api/auth/me which returns UserPublic directly (documented discrepancy).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginResponseData"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a Patient or Nurse
      description: >
        Single registration endpoint for both Patient and Nurse signup, distinguished by
        the `role` field in the request body. Nurse accounts start in a pending
        verification/approval state. Nurse document uploads (Aadhaar/certificate/photo)
        are UI-only today and NOT sent in this request; see /api/v1/nurse/documents.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/RegisterPatientRequest"
                - $ref: "#/components/schemas/RegisterNurseRequest"
              discriminator:
                propertyName: role
                mapping:
                  PATIENT: "#/components/schemas/RegisterPatientRequest"
                  NURSE: "#/components/schemas/RegisterNurseRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPublic"
        "409":
          description: Duplicate email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      description: Returns the authenticated user directly as `data` (not wrapped in `{ user }` - contrast with /api/auth/login).
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserPublic"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out and clear the session cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /api/auth/google:
    get:
      tags: [Auth]
      summary: Google OAuth entry point
      description: Server-side OAuth redirect flow (browser navigation, not a JSON fetch) - redirects to Google, callback sets session cookie, redirects back into the app.
      security: []
      responses:
        "302":
          description: Redirect to Google OAuth consent screen

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the logged-in user's password
      description: Shared auth endpoint used from Nurse and Patient settings screens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─────────────────────────────── PUBLIC ───────────────────────────────
  /api/v1/contacts:
    post:
      tags: [Public]
      summary: Submit the public contact-us form
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "201":
          description: Contact inquiry created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ContactInquiryPublic"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/waitlist:
    post:
      tags: [Public]
      summary: Join the pre-launch waitlist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitlistRequest"
      responses:
        "201":
          description: Waitlist entry created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/WaitlistEntryPublic"
        "409":
          description: Duplicate email
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/services:
    get:
      tags: [Public]
      summary: List active public services
      description: INFERRED - the current public services page reads a hardcoded frontend array, no live call exists yet.
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: isActive
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ServicePublic"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"

  /api/v1/services/{slug}:
    get:
      tags: [Public]
      summary: Get one public service by slug
      description: INFERRED - the current service detail page resolves against a hardcoded array, no live call exists yet.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
      responses:
        "200":
          description: Service detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServicePublic"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─────────────────────────────── ADMIN ───────────────────────────────
  /api/v1/admin/dashboard:
    get:
      tags: [Admin]
      summary: Admin dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DashboardStats"

  /api/v1/search:
    get:
      tags: [Admin]
      summary: Generic entity search/list/pagination endpoint
      description: >
        Single generic endpoint used by all admin list screens. The `entity` query
        param selects the resource, and the response `data` shape varies accordingly
        (see NurseEntry, PatientEntry, ServiceEntry, WaitlistEntryPublic, ContactInquiryPublic).
      parameters:
        - name: entity
          in: query
          required: true
          schema:
            type: string
            enum: [nurses, patients, services, contacts, waitlist]
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Used by nurses (verificationStatus) and contacts (status) only.
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: sortBy
          in: query
          schema:
            type: string
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated, entity-specific rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          oneOf:
                            - $ref: "#/components/schemas/NurseEntry"
                            - $ref: "#/components/schemas/PatientEntry"
                            - $ref: "#/components/schemas/ServiceEntry"
                            - $ref: "#/components/schemas/WaitlistEntryPublic"
                            - $ref: "#/components/schemas/ContactInquiryPublic"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"

  /api/v1/admin/nurses/{publicId}:
    get:
      tags: [Admin]
      summary: Get full nurse profile (detail/verification view)
      description: INFERRED - no admin nurse-detail page exists in the frontend yet; justified by NurseProfilePublic/NurseDocumentPublic types.
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      responses:
        "200":
          description: Nurse profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NurseProfilePublic"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/nurses/{publicId}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending nurse's verification
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      responses:
        "200":
          description: Nurse approved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NurseEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/nurses/{publicId}/reject:
    post:
      tags: [Admin]
      summary: Reject a pending nurse's verification
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      responses:
        "200":
          description: Nurse rejected
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NurseEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/services:
    post:
      tags: [Admin]
      summary: Create a new service
      description: INFERRED - the "Add Service" button in the admin UI has no wired handler; endpoint inferred from ServicePublic fields and standard CRUD convention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRequest"
      responses:
        "201":
          description: Service created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServicePublic"

  /api/v1/admin/services/{publicId}:
    patch:
      tags: [Admin]
      summary: Edit an existing service
      description: INFERRED - Edit button in admin UI has no wired handler.
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRequest"
      responses:
        "200":
          description: Service updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServicePublic"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete a service
      description: INFERRED - Trash icon button in admin UI has no wired handler.
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      responses:
        "200":
          description: Service deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/services/{publicId}/toggle:
    patch:
      tags: [Admin]
      summary: Toggle a service's isActive flag
      description: INFERRED - Toggle icon button in admin UI has no wired handler; could alternatively be folded into the generic PATCH.
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      responses:
        "200":
          description: Service toggled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServicePublic"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/contacts/{publicId}/status:
    patch:
      tags: [Admin]
      summary: Update a contact inquiry's status
      description: INFERRED - contact detail panel in admin UI only sets local state today, no apiFetch call exists yet.
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [NEW, READ, REPLIED, ARCHIVED]
      responses:
        "200":
          description: Contact inquiry updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ContactInquiryPublic"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─────────────────────────────── SUPER ADMIN ───────────────────────────────
  /api/v1/admin/admins:
    get:
      tags: [SuperAdmin]
      summary: List/search admin accounts
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of admin accounts (not paginated in current frontend usage)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AdminEntry"
    post:
      tags: [SuperAdmin]
      summary: Create a new admin or super-admin account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminRequest"
      responses:
        "201":
          description: Admin created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminEntry"
        "409":
          description: Duplicate email
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/admin/admins/{publicId}/suspend:
    post:
      tags: [SuperAdmin]
      summary: Toggle an admin account's suspension state
      description: Single endpoint used bidirectionally to suspend/reactivate based on the admin's current status.
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      responses:
        "200":
          description: Admin status toggled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/audit-logs:
    get:
      tags: [SuperAdmin]
      summary: List/search platform audit log entries
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/PageParam"
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AuditLogPublic"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"

  /api/v1/admin/roles:
    get:
      tags: [SuperAdmin]
      summary: List roles with their permission sets
      description: >
        INFERRED / speculative - the live Roles & Permissions screen currently renders
        a hardcoded mock array, not a fetch call. Confirm with frontend whether roles
        should be a live CRUD resource or a fixed, code-defined RBAC matrix before
        building this as a real endpoint.
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/RolePublic"

  /api/v1/admin/permissions:
    get:
      tags: [SuperAdmin]
      summary: List all available permissions in the system
      description: INFERRED / lowest confidence - no fetch call and no dedicated page exist for this today; it is currently a dead link in the UI.
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/PermissionPublic"

  /api/v1/admin/settings:
    get:
      tags: [SuperAdmin]
      summary: Get global platform settings
      description: >
        INFERRED - no GET call exists in the frontend (the settings form loads from
        hardcoded local defaults), but a GET is a probable gap the backend should still
        expose for correctness.
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlatformSettings"
    put:
      tags: [SuperAdmin]
      summary: Update global platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettings"
      responses:
        "200":
          description: Platform settings updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PlatformSettings"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─────────────────────────────── NURSE ───────────────────────────────
  /api/v1/nurse/appointments:
    get:
      tags: [Nurse]
      summary: List the logged-in nurse's appointments
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AppointmentStatus"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AppointmentPublic"
                      meta:
                        $ref: "#/components/schemas/PaginationMeta"

  /api/v1/nurse/appointments/{publicId}/accept:
    post:
      tags: [Nurse]
      summary: Accept a pending appointment request
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      responses:
        "200":
          description: Appointment accepted (status CONFIRMED)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AppointmentPublic"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Appointment not in an acceptable state

  /api/v1/nurse/appointments/{publicId}/reject:
    post:
      tags: [Nurse]
      summary: Decline a pending appointment request
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectAppointmentRequest"
      responses:
        "200":
          description: Appointment rejected (status CANCELLED/REJECTED)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AppointmentPublic"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Appointment not in a rejectable state

  /api/v1/nurse/appointments/{publicId}/check-in:
    post:
      tags: [Nurse]
      summary: Check in / start a care visit
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      responses:
        "200":
          description: Visit started (status IN_PROGRESS, checkInTime set)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AppointmentPublic"
        "409":
          description: Appointment not CONFIRMED/ACCEPTED

  /api/v1/nurse/appointments/{publicId}/check-out:
    post:
      tags: [Nurse]
      summary: Complete a care visit with clinical notes and vitals
      description: Marks the appointment COMPLETED, records checkOutTime, appends care notes, and creates a paid earning transaction.
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckOutRequest"
      responses:
        "200":
          description: Visit completed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AppointmentPublic"
        "409":
          description: Appointment not IN_PROGRESS

  /api/v1/nurse/appointments/{publicId}/care-notes:
    post:
      tags: [Nurse]
      summary: Add a standalone care note to an appointment
      parameters:
        - $ref: "#/components/parameters/PublicIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareNoteCreateRequest"
      responses:
        "201":
          description: Care note added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CareNotePublic"

  /api/v1/nurse/availability:
    get:
      tags: [Nurse]
      summary: Get the nurse's weekly availability schedule and on-duty flag
      responses:
        "200":
          description: Nurse availability
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/NurseAvailability"
    put:
      tags: [Nurse]
      summary: Update the nurse's weekly availability schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NurseAvailability"
      responses:
