components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: >
        httpOnly session cookie set by /api/auth/login, /api/auth/register, and
        /api/auth/google. The frontend always sends requests with credentials:'include'
        rather than an Authorization header.

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
    PublicIdParam:
      name: publicId
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponse"

  schemas:
    # ─── Envelope ───
    ApiResponse:
      type: object
      description: >
        Generic response envelope used by every endpoint. `data` is typed per-endpoint
        via allOf overrides in each operation's response schema; `meta` is populated
        only for paginated list endpoints.
      properties:
        success:
          type: boolean
        data:
          nullable: true
        meta:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PaginationMeta"
        error:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ApiError"
      required: [success, data, meta, error]

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [page, limit, total, totalPages]

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
      required: [code, message]

    # ─── Auth ───
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string

    LoginResponseData:
      type: object
      description: NOTE - login wraps the user, unlike GET /api/auth/me which returns UserPublic directly.
      properties:
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [user]

    RegisterPatientRequest:
      type: object
      description: >
        NOTE - includes `dob`, which the frontend submit handler sends but which is
        absent from the RegisterPatientRequest TS type (documented discrepancy).
      required: [fullName, email, phone, password, dob, address, city, state, role]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
        dob:
          type: string
          format: date
          description: "'yyyy-MM-dd' - sent by the frontend though not declared on RegisterPatientRequest."
        address:
          type: string
        city:
          type: string
        state:
          type: string
        role:
          type: string
          enum: [PATIENT]

    RegisterNurseRequest:
      type: object
      required:
        [
          fullName,
          email,
          phone,
          password,
          gender,
          dateOfBirth,
          address,
          experience,
          qualifications,
          certifications,
          role,
        ]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER, PREFER_NOT_TO_SAY]
        dateOfBirth:
          type: string
          format: date
          description: "'yyyy-MM-dd', age 18-70 enforced client-side."
        address:
          type: string
        city:
          type: string
        state:
          type: string
        experience:
          type: string
        qualifications:
          type: string
        certifications:
          type: string
        preferredContact:
          type: string
          enum: [email, phone, whatsapp]
        role:
          type: string
          enum: [NURSE]

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
        confirmPassword:
          type: string

    # ─── User ───
    UserPublic:
      type: object
      properties:
        publicId:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        fullName:
          type: string
        role:
          type: string
        status:
          type: string
        emailVerified:
          type: boolean
        avatarUrl:
          type: string
          nullable: true
        lastLoginAt:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        [
          publicId,
          email,
          phone,
          fullName,
          role,
          status,
          emailVerified,
          avatarUrl,
          lastLoginAt,
          createdAt,
        ]

    # ─── Nurse domain ───
    NurseProfilePublic:
      type: object
      properties:
        publicId:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
        gender:
          type: string
          nullable: true
        dateOfBirth:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        experience:
          type: string
          nullable: true
        qualifications:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        verificationStatus:
          type: string
        preferredContact:
          type: string
          nullable: true
        documents:
          type: array
          items:
            $ref: "#/components/schemas/NurseDocumentPublic"
        createdAt:
          type: string
      required:
        [
          publicId,
          user,
          gender,
          dateOfBirth,
          address,
          city,
          state,
          experience,
          qualifications,
          certifications,
          verificationStatus,
          preferredContact,
          documents,
          createdAt,
        ]

    NurseDocumentPublic:
      type: object
      properties:
        publicId:
          type: string
        type:
          type: string
        fileName:
          type: string
        fileUrl:
          type: string
        verified:
          type: boolean
        createdAt:
          type: string
      required: [publicId, type, fileName, fileUrl, verified, createdAt]

    NurseProfileUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        address:
          type: string
        experience:
          type: string
        qualifications:
          type: string
        certifications:
          type: string

    NurseEntry:
      type: object
      description: Narrower row shape returned by GET /api/v1/search?entity=nurses (not the full NurseProfilePublic).
      properties:
        publicId:
          type: string
        verificationStatus:
          type: string
        experience:
          type: string
          nullable: true
        user:
          type: object
          properties:
            publicId:
              type: string
            email:
              type: string
            fullName:
              type: string
            phone:
              type: string
              nullable: true
            status:
              type: string
            createdAt:
              type: string
      required: [publicId, verificationStatus, experience, user]

    NurseAvailability:
      type: object
      properties:
        days:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
              active:
                type: boolean
              hours:
                type: string
        shiftPreferences:
          type: object
          properties:
            morning:
              type: boolean
            afternoon:
              type: boolean
            evening:
              type: boolean
            night:
              type: boolean
        onDutyNow:
          type: boolean

    NurseVerificationStatus:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, UNDER_REVIEW, APPROVED, REJECTED]
        timeline:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              description:
                type: string
              status:
                type: string
                enum: [completed, current, upcoming, rejected]
              date:
                type: string

    NurseSettings:
      type: object
      properties:
        notifications:
          type: object
          properties:
            verificationUpdates:
              type: boolean
            newPatientRequests:
              type: boolean
            scheduleReminders:
              type: boolean
            platformAnnouncements:
              type: boolean
        contactPreference:
          type: string
          enum: [Email, Phone, WhatsApp]

    BankAccount:
      type: object
      properties:
        bankName:
          type: string
        accountNumberMasked:
          type: string
        ifsc:
          type: string
        holderName:
          type: string
        verified:
          type: boolean

    BankAccountUpdateRequest:
      type: object
      required: [bankName, accountNumber, ifsc, holderName]
      properties:
        bankName:
          type: string
        accountNumber:
          type: string
        ifsc:
          type: string
        holderName:
          type: string

    NurseMessage:
      type: object
      properties:
        id:
          type: string
        senderId:
          type: string
        text:
          type: string
        timestamp:
          type: string
        status:
          type: string
          enum: [sent]
        attachment:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MessageAttachment"
      required: [id, senderId, text, timestamp, status]

    MessageAttachment:
      type: object
      properties:
        type:
          type: string
          enum: [image, doc]
        url:
          type: string
        name:
          type: string
      required: [type, url, name]

    SendMessageRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        attachment:
          $ref: "#/components/schemas/MessageAttachment"

    NurseMessageThread:
      type: object
      properties:
        id:
          type: string
        patientName:
          type: string
        patientAge:
          type: integer
        patientGender:
          type: string
        serviceName:
          type: string
        phone:
          type: string
        online:
          type: boolean
        unreadCount:
          type: integer
        lastActive:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/NurseMessage"
      required: [id, patientName, serviceName, unreadCount]

    # ─── Nurse appointments/care ───
    AppointmentStatus:
      type: string
      enum:
        [
          PENDING_ACCEPTANCE,
          REQUESTED,
          ACCEPTED,
          CONFIRMED,
          REJECTED,
          IN_PROGRESS,
          COMPLETED,
          CANCELLED,
        ]

    AppointmentPublic:
      type: object
      properties:
        publicId:
          type: string
        patientName:
          type: string
        patientAge:
          type: integer
        patientGender:
          type: string
        patientAvatar:
          type: string
          nullable: true
        patientPhone:
          type: string
        serviceName:
          type: string
        serviceSlug:
          type: string
        date:
          type: string
          description: ISO date or formatted string
        timeSlot:
          type: string
          example: "09:00 AM - 01:00 PM"
        durationHours:
          type: number
        location:
          type: object
          properties:
            address:
              type: string
            city:
              type: string
            state:
              type: string
            distanceKm:
              type: number
          required: [address, city]
        payoutAmount:
          type: number
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        specialInstructions:
          type: string
        medicalConditions:
          type: array
          items:
            type: string
        rejectionReason:
          type: string
        checkInTime:
          type: string
        checkOutTime:
          type: string
        careNotes:
          type: array
          items:
            $ref: "#/components/schemas/CareNotePublic"
        createdAt:
          type: string
      required: [publicId, patientName, serviceName, date, timeSlot, location, payoutAmount, status]

    CareNotePublic:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
        vitals:
          type: object
          properties:
            bloodPressure:
              type: string
            heartRate:
              type: string
            temperature:
              type: string
            oxygenSaturation:
              type: string
            oxygenLevel:
              type: string
        medicationsAdministered:
          type: array
          items:
            type: string
        notes:
          type: string
        authorName:
          type: string
      required: [id, timestamp, notes, authorName]

    CareNoteCreateRequest:
      type: object
      required: [notes]
      properties:
        vitals:
          type: object
          properties:
            bloodPressure:
              type: string
            heartRate:
              type: string
            temperature:
              type: string
            oxygenSaturation:
              type: string
        medicationsAdministered:
          type: array
          items:
            type: string
        notes:
          type: string

    RejectAppointmentRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: >
            One of 'Schedule conflict' | 'Location too far from my zone' |
            'Outside my clinical expertise' | free text when 'Other'.

    CheckOutRequest:
      type: object
      required: [notes]
      properties:
        notes:
          type: string
        vitals:
          type: object
          properties:
            bloodPressure:
              type: string
            heartRate:
              type: string
            temperature:
              type: string
            oxygenSaturation:
              type: string
        medicationsAdministered:
          type: array
          items:
            type: string

    # ─── Nurse earnings ───
    EarningTransactionPublic:
      type: object
      properties:
        id:
          type: string
        appointmentId:
          type: string
        patientName:
          type: string
        serviceName:
          type: string
        date:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [PAID, PROCESSING, PENDING]
        paymentMethod:
          type: string
      required: [id, patientName, serviceName, date, amount, status]

    NurseEarningsSummary:
      type: object
      properties:
        todayEarnings:
          type: number
        weekEarnings:
          type: number
        monthEarnings:
          type: number
        totalEarnings:
          type: number
        pendingPayout:
          type: number
        completedVisitsCount:
          type: integer
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/EarningTransactionPublic"
      required:
        [
          todayEarnings,
          weekEarnings,
          monthEarnings,
          totalEarnings,
          pendingPayout,
          completedVisitsCount,
          transactions,
        ]

    # ─── Patient domain ───
    PatientProfilePublic:
      type: object
      properties:
        publicId:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        registrationStatus:
          type: string
        createdAt:
          type: string
      required: [publicId, user, address, city, state, registrationStatus, createdAt]

    PatientProfileUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string

    PatientEntry:
      type: object
      description: Row shape returned by GET /api/v1/search?entity=patients.
      properties:
        publicId:
          type: string
        registrationStatus:
          type: string
        user:
          type: object
          properties:
            publicId:
              type: string
            email:
              type: string
            fullName:
              type: string
            phone:
              type: string
              nullable: true
            createdAt:
              type: string
      required: [publicId, registrationStatus, user]

    PatientSettings:
      type: object
      properties:
        notifyServiceLaunches:
          type: boolean
        notifyPromotions:
          type: boolean
        notifyAccountAlerts:
          type: boolean

    CarePlan:
      type: object
      description: INFERRED - no matching type in types/index.ts, modeled from mock dashboard data.
      properties:
        title:
          type: string
        completed:
          type: integer
        total:
          type: integer
        nextStep:
          type: string
      required: [title, completed, total, nextStep]

    HealthSummaryItem:
      type: object
      description: INFERRED - no matching type in types/index.ts, modeled from mock dashboard data.
      properties:
        label:
          type: string
        value:
          type: string
        unit:
          type: string
      required: [label, value]

    EmergencyContact:
      type: object
      description: INFERRED - no field for this exists on PatientProfilePublic today.
      properties:
        name:
          type: string
        relationship:
          type: string
        phone:
          type: string
      required: [name, relationship, phone]

    NearbyProvider:
      type: object
      description: INFERRED - scoped to nurses only; rating/distance/availability have no existing type.
      properties:
        publicId:
          type: string
        user:
          type: object
          properties:
            fullName:
              type: string
            avatarUrl:
              type: string
              nullable: true
        specialty:
          type: string
        distanceKm:
          type: number
        rating:
          type: number
        nextAvailableSlot:
          type: string
      required: [publicId]

    BookAppointmentRequest:
      type: object
      description: INFERRED - modeled on AppointmentPublic minus server-computed fields (payoutAmount, status).
      required: [nurseId, serviceSlug, date, timeSlot]
      properties:
        nurseId:
          type: string
          description: publicId of the chosen nurse provider.
        serviceSlug:
          type: string
        date:
          type: string
          format: date
        timeSlot:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        specialInstructions:
          type: string
        medicalConditions:
          type: array
          items:
            type: string

    # ─── Public / marketing ───
    ServicePublic:
      type: object
      properties:
        publicId:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        shortDesc:
          type: string
          nullable: true
        heroImage:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        features:
          type: array
          items:
            type: string
        pricingRange:
          type: string
          nullable: true
        isActive:
          type: boolean
        seoTitle:
          type: string
          nullable: true
        seoDescription:
          type: string
          nullable: true
      required:
        [
          publicId,
          name,
          slug,
          description,
          shortDesc,
          heroImage,
          icon,
          features,
          pricingRange,
          isActive,
          seoTitle,
          seoDescription,
        ]

    ServiceEntry:
      type: object
      description: Row shape returned by GET /api/v1/search?entity=services.
      properties:
        publicId:
          type: string
        name:
          type: string
        slug:
          type: string
        shortDesc:
          type: string
          nullable: true
        isActive:
          type: boolean
        pricingRange:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [publicId, name, slug, isActive]

    CreateServiceRequest:
      type: object
      required: [name, slug, description, features, isActive]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9-]+$"
        description:
          type: string
        shortDesc:
          type: string
        heroImage:
          type: string
        icon:
          type: string
        features:
          type: array
          items:
            type: string
        pricingRange:
          type: string
        isActive:
          type: boolean
        seoTitle:
          type: string
        seoDescription:
          type: string

    UpdateServiceRequest:
      type: object
      description: Partial<ServicePublic> - any subset of CreateServiceRequest fields being edited.
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        shortDesc:
          type: string
        heroImage:
          type: string
        icon:
          type: string
        features:
          type: array
          items:
            type: string
        pricingRange:
          type: string
        isActive:
          type: boolean
        seoTitle:
          type: string
        seoDescription:
          type: string

    ContactRequest:
      type: object
      required: [name, email, subject, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          description: Optional, 10-15 digit pattern.
        subject:
          type: string
          minLength: 3
          maxLength: 200
        message:
          type: string
          minLength: 10
          maxLength: 5000

    ContactInquiryPublic:
      type: object
      properties:
        publicId:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        subject:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [NEW, IN_PROGRESS, RESOLVED, CLOSED]
        createdAt:
          type: string
      required: [publicId, name, email, phone, subject, message, status, createdAt]

    WaitlistRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        source:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 50
        phone:
          type: string
          maxLength: 50

    WaitlistEntryPublic:
      type: object
      properties:
        publicId:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        notified:
          type: boolean
        createdAt:
          type: string
      required: [publicId, email, name, phone, source, notified, createdAt]

    # ─── Admin / SuperAdmin ───
    DashboardStats:
      type: object
      properties:
        totalPatients:
          type: integer
        totalNurses:
          type: integer
        pendingVerifications:
          type: integer
        waitlistCount:
          type: integer
        newContacts:
          type: integer
        totalAdmins:
          type: integer
          description: Present in Super Admin dashboard payload; not declared on the shared DashboardStats TS type.
        totalAuditLogs:
          type: integer
          description: Present in Super Admin dashboard payload; not declared on the shared DashboardStats TS type.
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogPublic"
      required:
        [totalPatients, totalNurses, pendingVerifications, waitlistCount, newContacts]

    AuditLogPublic:
      type: object
      properties:
        id:
          type: string
        actorName:
          type: string
          nullable: true
        actorEmail:
          type: string
          nullable: true
        action:
          type: string
          description: "Known values include CREATE, UPDATE, DELETE, LOGIN, LOGOUT (not necessarily exhaustive)."
        resource:
          type: string
        resourceId:
          type: string
          nullable: true
        oldValue:
          nullable: true
        newValue:
          nullable: true
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
      required: [id, actorName, actorEmail, action, resource, resourceId, ipAddress, createdAt]

    AdminEntry:
      type: object
      properties:
        publicId:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum: [ADMIN, SUPER_ADMIN]
        status:
          type: string
        createdAt:
          type: string
      required: [publicId, email, fullName, role, status, createdAt]

    CreateAdminRequest:
      type: object
      required: [fullName, email, password, role]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [ADMIN, SUPER_ADMIN]

    RolePublic:
      type: object
      properties:
        publicId:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        hierarchy:
          type: integer
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/PermissionPublic"
      required: [publicId, name, slug, description, hierarchy, isSystem, permissions]

    PermissionPublic:
      type: object
      properties:
        publicId:
          type: string
        resource:
          type: string
        action:
          type: string
        description:
          type: string
          nullable: true
      required: [publicId, resource, action, description]

    PlatformSettings:
      type: object
      description: >
        maxLoginAttempts and sessionTimeout are bound from numeric <input> fields as
        strings on the frontend; backend should coerce/validate as integers.
      properties:
        siteName:
          type: string
        supportEmail:
          type: string
          format: email
        launchDate:
          type: string
        maintenanceMode:
          type: boolean
        registrationEnabled:
          type: boolean
        nurseRegistrationEnabled:
          type: boolean
        maxLoginAttempts:
          type: string
        sessionTimeout:
          type: string
      required:
        [
          siteName,
          supportEmail,
          launchDate,
          maintenanceMode,
          registrationEnabled,
          nurseRegistrationEnabled,
          maxLoginAttempts,
          sessionTimeout,
        ]
