name: Build iOS App (Capacitor)

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build-web:
    name: Build Next.js Web App (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      matrix:
        target: [patient, nurse]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/apps/${{ matrix.target }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.target }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.target }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Next.js Web App (${{ matrix.target }})
        run: npm run build -w @mendyr/${{ matrix.target }}
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-out-ios-${{ matrix.target }}
          path: apps/${{ matrix.target }}/out
          retention-days: 1

  build-ios:
    name: Build iOS IPA (${{ matrix.target }})
    runs-on: macos-latest
    needs: build-web
    strategy:
      matrix:
        target: [patient, nurse]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install NPM Dependencies
        run: npm ci

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-out-ios-${{ matrix.target }}
          path: apps/${{ matrix.target }}/out

      - name: Sync Capacitor iOS
        working-directory: ./apps/${{ matrix.target }}
        run: npx cap sync ios

      - name: Build iOS App
        working-directory: ./apps/${{ matrix.target }}/ios/App
        run: |
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
