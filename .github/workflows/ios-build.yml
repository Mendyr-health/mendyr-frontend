name: Build iOS App (Capacitor)

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
  schedule:
    - cron: '0 5 * * *' # Runs at 5:00 AM UTC every day

jobs:
  build-web:
    name: Build Next.js Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Next.js Web App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000/api/v1/' }}

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-out-ios
          path: out
          retention-days: 1

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    needs: build-web
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-out-ios
          path: out

      - name: Symlink Node for Xcode
        run: sudo ln -s $(which node) /usr/local/bin/node || true

      - name: Update CocoaPods Repo
        run: pod repo update || true
        working-directory: ./ios/App

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned iOS App Archive
        working-directory: ./ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build \
          -derivedDataPath build
          
      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mendyr-ios-unsigned
          path: ios/App/build/Build/Products/Release-iphoneos/App.app
          retention-days: 7
