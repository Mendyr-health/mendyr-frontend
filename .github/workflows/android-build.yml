name: Build Android App (Capacitor)

on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab
  schedule:
    - cron: '0 5 * * *' # Runs at 5:00 AM UTC every day

permissions:
  contents: write

jobs:
  build-web:
    name: Build Next.js Web App (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: patient
            app_target: patient
          - target: nurse
            app_target: provider
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/apps/patient/.next/cache
          key: ${{ runner.os }}-nextjs-${{ matrix.target }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ matrix.target }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Next.js Web App
        run: npm run build -w @mendyr/patient
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          NEXT_PUBLIC_APP_TARGET: ${{ matrix.app_target }}

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-out-android-${{ matrix.target }}
          path: apps/patient/out
          retention-days: 1

  build-android:
    name: Build Android APK (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: build-web
    strategy:
      matrix:
        include:
          - target: patient
            apk_name: Mendyr
          - target: nurse
            apk_name: Mendyr Work
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NPM Dependencies
        run: npm ci

      - name: Download Web Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build-out-android-${{ matrix.target }}
          path: apps/patient/out

      - name: Sync Capacitor Android
        working-directory: ./apps/${{ matrix.target }}
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./apps/${{ matrix.target }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK file
        working-directory: ./apps/${{ matrix.target }}/android
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${{ matrix.apk_name }}.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk_name }}
          path: apps/${{ matrix.target }}/android/app/build/outputs/apk/debug/${{ matrix.apk_name }}.apk
          retention-days: 7

  release:
    name: Create Nightly Release
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Patient APK
        uses: actions/download-artifact@v4
        with:
          name: Mendyr
          path: release-artifacts

      - name: Download Nurse APK
        uses: actions/download-artifact@v4
        with:
          name: Mendyr Work
          path: release-artifacts

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest Mobile Builds"
          body: "Direct download links for the latest Android APKs."
          files: release-artifacts/*.apk
          prerelease: false
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
